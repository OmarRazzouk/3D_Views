<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Model Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin: 0; background: #111; font-family: sans-serif; }

    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    button {
      padding: 8px 12px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      display: none;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: #111;
    }
  </style>
</head>

<body>

  <div id="toolbar">
    <button onclick="viewer.resetCamera()">Reset View</button>
    <button onclick="viewer.autoRotate = !viewer.autoRotate">Toggle Rotate</button>
    <button onclick="changeHDRI()">Change HDRI</button>
  </div>

  <div id="loading">Loading...</div>

  <model-viewer id="viewer"
    src="model.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1.2"
    environment-image="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr"
    min-camera-orbit="auto auto 0.25m"
  ></model-viewer>

  <script>
    const viewer = document.getElementById('viewer');
    const loading = document.getElementById('loading');

    viewer.addEventListener('load', () => {
      loading.style.display = 'none';
    });

    viewer.addEventListener('preload', () => {
      loading.style.display = 'block';
    });

    function changeHDRI() {
      viewer.environmentImage =
        viewer.environmentImage.includes("moon")
          ? "https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k.hdr"
          : "https://modelviewer.dev/shared-assets/environments/moon_1k.hdr";
    }
  </script>

</body>
</html>
